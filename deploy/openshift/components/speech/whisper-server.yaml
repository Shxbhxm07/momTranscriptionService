apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-server
  labels: {app: whisper-server}
spec:
  replicas: 1                      # serialises on its GPU; scale by adding GPUs, not replicas on one
  selector: {matchLabels: {app: whisper-server}}
  template:
    metadata: {labels: {app: whisper-server}}
    spec:
      containers:
      - name: whisper
        image: offline-mom-whisper
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: offline-mom-config}}]   # WHISPER_MODEL, WHISPER_VAD_MODEL, WHISPER_THREADS
        # PROCESSOR BUILD by default (whisper-service/Dockerfile), because this cluster has no GPU.
        # Threads are what decide the speed here: measured 7.6 min for a 9.3-minute meeting on 8,
        # 6.5 min on 16. Give the pod at least as many cores as WHISPER_THREADS, or it will be
        # slower than the number suggests.
        env:
        - {name: WHISPER_THREADS, value: "8"}
        resources:
          requests: {cpu: "8", memory: 4Gi}
          limits: {memory: 8Gi}
        # ── FOR A GPU CLUSTER, build whisper-service/Dockerfile.gpu and swap the two blocks above
        # for these: a meeting then takes 40 s instead of 8 minutes.
        #   env:
        #   - {name: NVIDIA_VISIBLE_DEVICES, value: all}
        #   - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}   # else no libcuda.so.1
        #   resources:
        #     requests: {cpu: "2", memory: 4Gi}
        #     limits: {memory: 8Gi, nvidia.com/gpu: 1}     # ~4.2 GB of GPU memory in use
        volumeMounts: [{name: models, mountPath: /models, readOnly: true}]
        # whisper.cpp binds its port only after the model is on the GPU, so port-open = ready.
        readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 60, periodSeconds: 10}
        livenessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 120, periodSeconds: 30, failureThreshold: 5}
      volumes: [{name: models, persistentVolumeClaim: {claimName: offline-mom-models, readOnly: true}}]
---
apiVersion: v1
kind: Service
metadata: {name: whisper-server}
spec: {selector: {app: whisper-server}, ports: [{port: 8080, targetPort: 8080}]}
