# Kafka worker: job in → MoM via transcribe-api → .docx to MinIO → document to Elasticsearch → ack.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mom-consumer
  labels: {app: mom-consumer}
spec:
  replicas: 1                      # jobs are processed one at a time by design
  strategy: {type: Recreate}       # never two consumers during a rollout
  selector: {matchLabels: {app: mom-consumer}}
  template:
    metadata: {labels: {app: mom-consumer}}
    spec:
      terminationGracePeriodSeconds: 3600   # SIGTERM finishes the meeting in hand before exiting
      containers:
      - name: consumer
        image: REGISTRY/offline-mom-api:1.0.0
        command: ["python", "/app/consumer.py"]
        envFrom:
        - {configMapRef: {name: mom-config}}
        - {secretRef: {name: mom-secrets}}
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {memory: 1Gi}
        volumeMounts: [{name: scratch, mountPath: /tmp}]
        # No web server here. The poll loop touches this file at least every 5 s — including while a
        # long meeting runs — so a file older than 2 minutes means the loop itself is stuck.
        livenessProbe:
          exec: {command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/consumer-alive) )) -lt 120"]}
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
      volumes: [{name: scratch, emptyDir: {}}]
